[package]
name = "bullxi"
version = "0.1.0"
description = "BULL-XI: fantasy league for onchain stocks"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bullxi"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.0.2" }
ephemeral-rollups-sdk = { version = "0.17.3", features = ["anchor", "access-control"] }
